# -------------------------------------------------------------------
# ONNX OCR 引擎配置文件
# -------------------------------------------------------------------
# 在这里，您可以调整文字识别（OCR）功能的各项设置。
# 修改后请保存文件，重新加载模型或重启程序即可生效。
# 符号“#”开头的内容是注释，程序不会读取，仅用于说明。
# -------------------------------------------------------------------

# --- 通用设置 ---
# 这里是控制OCR引擎工作方式的基本选项。
common:
  # 是否使用显卡（GPU）进行识别。
  # 使用显卡可以极大地加快识别速度。如果您的电脑有独立显卡，建议保持为 true。
  # 如果没有，或者程序因此出错，请改为 false。
  use_gpu: false

  # 如果您的电脑上有多张显卡，这里可以指定使用哪一张。
  # 对于大多数用户来说，保持默认值 0 即可。
  gpu_id: 0

  # 是否启用文字方向检测。
  # 开启后，程序会自动判断文字是横排还是竖排，并尝试修正倾斜的文字，有助于提高识别准确率。
  use_angle_cls: False

# --- 文本检测器设置 ---
# 这些选项控制程序如何“找到”图片中的文字在哪里。
detector:
  # 使用的检测算法。'DB' 是一种常用且效果好的算法，通常无需修改。
  det_algorithm: DB

  # 检测模型的路径。这是程序用来“找字”的核心文件，请不要轻易修改。
  det_model_dir: OnnxOCR/onnxocr/models/ppocrv5/det/det.onnx

  # 图片处理尺寸限制。
  # 程序在找字前会缩放图片，这个值限制了图片最长边的像素。
  # 减小这个值可以加快速度，但可能导致小字漏检；增大则相反。960 是一个均衡的选择。
  det_limit_side_len: 960

  # 文本检测灵敏度（阈值）。
  # 数值在 0 到 1 之间。值越低，程序对“可能是文字”的区域越敏感，越容易找出文字，但也可能把一些不是文字的图案误认为文字。
  # 默认值 0.3 通常效果不错。
  det_db_thresh: 0.3

  # 检测框的可信度阈值。
  # 程序找到文字后，会给出一个可信度评分。只有高于这个分数的才会被最终认定为文字。
  # 适当提高可以减少误识别。
  det_db_box_thresh: 0.6

  # Vatti clipping算法的扩张系数，用于控制检测框向外扩张的比例。
  # 对于紧凑排列的文字，一个合适的扩张比可以确保整个文本区域被完整包含。
  # 默认值 1.5 通常效果不错。
  det_db_unclip_ratio: 1.5

  # 检测结果得分计算方法。
  # - "fast": 根据外接矩形计算，速度快。
  # - "slow": 根据文字的实际不规则边界计算，速度稍慢但对不规则艺术字更精确。
  det_db_score_mode: "fast"

# --- 文本识别器设置 ---
# 找到文字位置后，这些选项控制程序如何“认出”这些字具体是什么。
recognizer:
  # 使用的识别算法。通常无需修改。
  rec_algorithm: SVTR_LCNet

  # 识别模型的路径。这是程序用来“认字”的核心文件，请不要轻易修改。
  rec_model_dir: OnnxOCR/onnxocr/models/ppocrv5/rec/rec.onnx

  # 识别用的字典文件路径。
  # 这个文件告诉程序所有可能出现的字符。
  rec_char_dict_path: OnnxOCR/onnxocr/models/ppocrv5/ppocrv5_dict.txt

# --- 文本方向分类器设置 ---
# 如果上面的 `use_angle_cls` 设置为 true，这里的选项会生效。
classifier:
  # 方向分类模型的路径。这是判断文字方向的核心文件。
  cls_model_dir: OnnxOCR/onnxocr/models/ppocrv4/cls/cls.onnx

  # 方向判断的可信度阈值。
  # 程序判断一个文本块需要旋转的可信度。只有高于此阈值，才会执行旋转操作。
  cls_thresh: 0.9