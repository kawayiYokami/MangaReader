<!-- 通用任务列表组件 -->

<!-- 空状态: 根据 taskType 显示不同的提示 -->
<el-empty
    v-if="tasks.length === 0"
    :description="taskType === 'translation' ? '暂无翻译任务' : '暂无压缩任务'"
    :image-size="120">
    <el-button type="primary" @click="triggerFileSelect">
        <span v-if="taskType === 'translation'">选择文件开始翻译</span>
        <span v-else>选择文件开始压缩</span>
    </el-button>
</el-empty>

<!-- 任务列表 -->
<div v-else class="task-list" style="max-height: 600px; overflow-y: auto;">
    <div
        v-for="(task, index) in tasks"
        :key="task.id"
        class="task-item"
        :class="{
            'task-processing': task.status === 'processing',
            'task-completed': task.status === 'completed',
            'task-error': task.status === 'error'
        }">

        <!-- 任务信息 (文件名和状态) -->
        <div class="task-info">
            <div class="task-name" :title="task.fileName" v-text="task.fileName"></div>
            <div class="task-details">
                <!-- 仅翻译任务显示页数 -->
                <span v-if="taskType === 'translation' && task.totalPages > 0" class="task-pages">
                    <span v-text="task.totalPages"></span> 页
                </span>
                <span class="task-status" v-text="getTaskStatusText(task.status)"></span>
            </div>
        </div>

        <!-- 进度条和进度详情 -->
        <div class="task-progress" v-if="task.status === 'processing'">
            <el-progress :percentage="task.progress" :show-text="false" :stroke-width="6"></el-progress>
            <div class="progress-detail">
                <!-- 翻译任务显示页码进度 -->
                <span v-if="taskType === 'translation' && task.totalPages > 0">
                    <span v-text="task.currentPage"></span> / <span v-text="task.totalPages"></span>
                </span>
                <!-- 压缩任务显示当前步骤文本 -->
                <span v-else v-text="task.currentStep"></span>
                <!-- 统一的百分比显示 -->
                <span style="float: right;"><span v-text="task.progress"></span>%</span>
            </div>
        </div>

        <!-- 任务操作区域 (状态标签和按钮) -->
        <div class="task-actions">
            <div class="task-status-tags">
               <el-tag v-if="task.status === 'completed'" type="success" size="small"><span class="material-symbols-rounded">check_circle</span> 完成</el-tag>
               <el-tag v-else-if="task.status === 'error'" type="danger" size="small" :title="task.error || task.currentStep"><span class="material-symbols-rounded">cancel</span> 失败</el-tag>
               <el-tag v-else-if="task.status === 'processing'" type="warning" size="small"><span class="material-symbols-rounded">autorenew</span> 处理中</el-tag>
               <el-tag v-else type="info" size="small"><span class="material-symbols-rounded">pause</span> 等待中</el-tag>
            </div>
            <div class="task-buttons">
                 <!-- 下载按钮，仅在完成后显示 -->
                <el-button
                    v-if="task.status === 'completed'"
                    size="small"
                    type="primary"
                    @click="downloadTask(task)">
                    <span class="material-symbols-rounded">download</span> 下载
                </el-button>
                <!-- 移除按钮，对非等待中且正在处理的任务禁用 -->
                <el-button
                    size="small"
                    type="danger"
                    @click="removeTask(index)"
                    :disabled="isProcessing && task.status !== 'pending'">
                    <span class="material-symbols-rounded">delete</span> 移除
                </el-button>
            </div>
        </div>
    </div>
</div>
