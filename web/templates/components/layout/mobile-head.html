<!-- HTML头部组件 - 移动端专用 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漫画浏览器 - 移动版</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <!-- 1. 资源预连接和预加载 (高优先级) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://unpkg.com/element-plus/dist/index.css" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" as="style">

    <!-- 2. 渲染阻塞的CSS (顺序: 框架 -> 字体 -> 自定义) -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="/static/css/modern-theme.css">
    <link rel="stylesheet" href="/static/css/mobile/browser.css?v={{ cache_buster }}">

    <!-- 3. 推迟加载的JavaScript (defer保证不阻塞渲染，并按顺序执行) -->
    <!-- 核心库 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js" defer></script>
    <script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.js" defer></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js" defer></script>
    
    <!-- 应用核心模块 -->
    <script src="/static/js/theme-manager.js" defer></script>
    <script src="/static/js/app-data.js" defer></script>
    
    <!-- 应用功能模块 -->
    <script src="/static/js/utils.js?v={{ cache_buster }}" defer></script>
    <script src="/static/js/manga-browser-base.js?v={{ cache_buster }}" defer></script>
    <script src="/static/js/mobile/manga-browser.js?v={{ cache_buster }}" defer></script>
    <script src="/static/js/cache-management.js?v={{ cache_buster }}" defer></script>
</head>
